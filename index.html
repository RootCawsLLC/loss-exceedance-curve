<!DOCTYPE html>
<html lang="en">
<head>

  <title>Exceedance Workbench — the odds of a loss bigger than X</title>
  <meta name="description" content="Give one cyber risk a frequency range and a loss range, simulate ten thousand years, and read the probability of any annual loss straight off an exceedance curve. Drop your own tolerance, reserve and materiality lines onto it. A RootCaws LLC risk lab tool." />

  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root{
      color-scheme:light;
      --paper:#f7ebed;--paper-2:#f0dee0;--panel:#ffffff;
      --ink:#3a3336;--ink-2:#4d4548;--muted:#7a7073;
      --line:#d8c9cc;--soft-line:rgba(58,51,54,.08);
      --rose:#8d5860;--rose-2:#c7848d;--rose-soft:#f4dcdf;
      --sage:#4c7359;--sage-soft:#e2eee6;
      --amber:#9a6a24;--amber-soft:#f7e9d4;
      --plum:#6f5b86;--plum-soft:#ece7f2;
      --ui:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      --display:'Fraunces',Georgia,serif;
      --shadow:0 10px 26px rgba(58,51,54,.07);
      --radius:14px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{background:var(--paper);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-width:320px;line-height:1.5}
    ::selection{background:var(--rose-soft)}
    a{color:var(--rose)}
    button,input,select{font:inherit;color:inherit}
    :focus-visible{outline:2px solid var(--rose);outline-offset:2px;border-radius:4px}
    .wrap{max-width:1400px;margin:0 auto;padding:0 24px}
    @media (max-width:767px){.wrap{padding:0 16px}}

    .masthead{padding-top:48px;padding-bottom:28px;border-bottom:1px solid var(--soft-line)}
    .kicker{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--rose)}
    .masthead h1{font-family:var(--display);font-weight:600;font-size:clamp(34px,4.6vw,56px);line-height:1.02;letter-spacing:-.02em;margin:10px 0 14px}

    .bench{display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr);gap:20px;align-items:start;padding-top:24px}

    .label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

    .stat{padding:12px 14px}

    .panel{padding:16px 18px 14px;margin-bottom:16px}
    .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
    .panel-head h2{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.01em}
    .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--paper)}
    .seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
    .seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(58,51,54,.12)}
    .readout{min-height:44px;font-size:14px;color:var(--ink-2);line-height:1.5;padding:4px 2px 8px}
    .readout b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}

    svg.chart{display:block;width:100%;height:auto;overflow:visible}
    svg.chart text{font-family:var(--ui);font-variant-numeric:tabular-nums}
    .chart-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:8px;flex-wrap:wrap;gap:6px}
    details.how{margin-top:10px}
    details.how summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--rose)}

    .lines{padding:16px 18px}
    .lines table{width:100%;border-collapse:collapse}

    .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:middle}
    .lines input.amt{width:118px;text-align:right}
    .lines input.name{width:100%;min-width:120px;background:transparent;border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:4px 0;font-weight:600}
    .lines input.name:focus{outline:none;border-bottom-color:var(--rose)}
    .lines .why{display:block;font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:2px}

    .x:hover{color:var(--rose)}
    .sentences{margin-top:12px;display:grid;gap:8px}
    .sentence{font-size:13.5px;line-height:1.55;color:var(--ink-2);padding:8px 12px;border-radius:8px;border-left:3px solid var(--line);background:var(--paper)}
    .compare{margin-top:12px;font-size:13.5px;line-height:1.6;color:var(--ink-2);padding:12px 14px;border-radius:10px;background:var(--rose-soft)}
    .compare b{color:var(--ink)}
    @media (max-width:640px){
      .lines table,.lines thead,.lines tbody,.lines tr,.lines td,.lines th{display:block}
      .lines thead{display:none}

      .lines td.num::before{content:attr(data-k) " ";color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
      .lines input.amt{width:100%}
    }

    .notes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding-top:28px;padding-bottom:80px}
    .notes::before{content:"Notes";grid-column:1/-1;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-bottom:10px;border-bottom:1px solid var(--soft-line)}
    .note{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px}
    @media (max-width:899px){.notes{grid-template-columns:1fr}}
    .note h3{font-family:var(--display);font-weight:600;font-size:19px;margin-bottom:8px;letter-spacing:-.01em}
    .note p{font-size:14px;color:var(--ink-2);line-height:1.65}
    .notes.embedded{padding-top:8px;padding-bottom:24px}

    .guide{padding:28px 0 8px}
    .guide h2{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:28px 0 12px;padding-bottom:10px;border-bottom:1px solid var(--soft-line)}
    .guide h2:first-of-type{margin-top:0}
    .guide-toc{display:flex;flex-wrap:wrap;gap:.35rem .9rem;margin:0 0 18px;font-size:13px}
    .guide-toc a{color:var(--rose)}
    .guide-pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    @media (max-width:699px){.guide-pair{grid-template-columns:1fr}}
    .guide-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
    .guide-box.use{border-left:3px solid var(--sage)}
    .guide-box.dont{border-left:3px solid var(--rose)}
    .guide-box h3{font-family:var(--display);font-weight:600;font-size:18px;margin:0 0 8px;letter-spacing:-.01em}
    .guide-box ul,.guide ol{margin:0;padding-left:1.15rem}
    .guide li{font-size:14px;color:var(--ink-2);line-height:1.65;margin:.4rem 0}
    .guide li b{color:var(--ink);font-weight:600}
    .guide-close{font-size:14px;color:var(--ink-2);line-height:1.65;margin:10px 0 0}

    @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

</head>
<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script>
  'use strict';
  const {useState,useEffect,useMemo,useRef,createElement:el}=React;

  // The portfolio risk lab renders this page inside an iframe and supplies its
  // own heading, so the masthead is dropped when we are not the top window.
  const EMBEDDED=(()=>{try{return window.self!==window.top;}catch(e){return true;}})();
  const YEARS=10000;
  const BENCHMARKS_URL="./risk-benchmarks.json";
  const DEFAULT_FREQ=[1,3,8];
  const DEFAULT_SEV=[500000,2000000,7000000];
  const SYMBOL={USD:"$",AUD:"A$",CAD:"C$",GBP:"£",EUR:"€"};

  // ---------------------------------------------------------------- format
  function symbolFor(ccy){return SYMBOL[ccy]||(ccy+" ");}
  function money(v,ccy){
    const s=symbolFor(ccy);
    if(!(v>0))return s+"0";
    if(v>=1e9)return s+(v/1e9).toFixed(1)+"B";
    if(v>=1e6)return s+(v/1e6).toFixed(1)+"M";
    if(v>=1e3)return s+Math.round(v/1e3)+"K";
    return s+Math.round(v);
  }
  function pct(p){
    const v=p*100;
    if(v===0)return "0%";
    if(v>=10)return Math.round(v)+"%";
    if(v>=1)return v.toFixed(1)+"%";
    return v.toFixed(2)+"%";
  }
  // "1 in 4" reads better than "25%" for the people who set thresholds.
  function oneIn(p){
    if(!(p>0))return null;
    const n=1/p;
    if(n<1.5)return "most years";
    if(n<10)return "about 1 year in "+n.toFixed(1).replace(/\.0$/,"");
    return "about 1 year in "+Math.round(n).toLocaleString();
  }
  // Accepts 500K, 2.5M, 1B, with or without a currency symbol or separators.
  function parseAmount(text){
    if(text==null)return NaN;
    const t=String(text).toUpperCase().replace(/[^0-9.KMB]/g,"");
    const m=t.match(/^([0-9]*\.?[0-9]+)([KMB]?)$/);
    if(!m)return NaN;
    return parseFloat(m[1])*({K:1e3,M:1e6,B:1e9,"":1})[m[2]];
  }
  function plain(n){return Number.isInteger(n)?String(n):String(+n.toPrecision(4));}

  // -------------------------------------------------------------- sampling
  function randn(){
    let u=0,v=0;
    while(u===0)u=Math.random();
    while(v===0)v=Math.random();
    return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
  }
  // Marsaglia and Tsang's gamma generator; a PERT draw is a scaled beta, and a
  // beta is the ratio of two gammas.
  function gamma(shape){
    if(shape<1)return gamma(shape+1)*Math.pow(Math.random(),1/shape);
    const d=shape-1/3,c=1/Math.sqrt(9*d);
    for(;;){
      let x,v;
      do{x=randn();v=1+c*x;}while(v<=0);
      v=v*v*v;
      const u=Math.random();
      if(u<1-0.0331*x*x*x*x)return d*v;
      if(Math.log(u)<0.5*x*x+d*(1-v+Math.log(v)))return d*v;
    }
  }
  function pert(lo,ml,hi){
    const span=hi-lo;
    if(!(span>0))return ml;
    const a=1+4*(ml-lo)/span,b=1+4*(hi-ml)/span;
    const x=gamma(a),y=gamma(b);
    return lo+span*(x/(x+y));
  }
  function poisson(rate){
    if(!(rate>0))return 0;
    if(rate>=40)return Math.max(0,Math.round(rate+Math.sqrt(rate)*randn()));
    const limit=Math.exp(-rate);
    let k=0,p=Math.random();
    while(p>limit){k++;p*=Math.random();}
    return k;
  }
  // One simulated year: a rate from the frequency range, a Poisson count of
  // events at that rate, and an independent loss for each event, summed.
  function simulate(freq,sev,years){
    const out=new Float64Array(years);
    for(let y=0;y<years;y++){
      const events=poisson(pert(freq[0],freq[1],freq[2]));
      let total=0;
      for(let e=0;e<events;e++)total+=pert(sev[0],sev[1],sev[2]);
      out[y]=total;
    }
    return out;
  }
  function summarise(raw){
    const sorted=Float64Array.from(raw).sort();
    const n=sorted.length;
    const q=p=>sorted[Math.min(n-1,Math.floor(p*n))];
    let sum=0,zeros=0;
    for(let i=0;i<n;i++){sum+=sorted[i];if(sorted[i]===0)zeros++;}
    return {sorted,n,p50:q(0.5),p90:q(0.9),p99:q(0.99),mean:sum/n,zeroShare:zeros/n,max:sorted[n-1]};
  }
  // Share of simulated years whose total loss reached x or more.
  function chanceAtLeast(run,x){
    const a=run.sorted;
    let lo=0,hi=run.n;
    while(lo<hi){const mid=(lo+hi)>>1;if(a[mid]<x)lo=mid+1;else hi=mid;}
    return (run.n-lo)/run.n;
  }
  function curvePoints(run,maxPts){
    const a=run.sorted,n=run.n,step=Math.max(1,Math.floor(n/maxPts)),pts=[];
    for(let i=0;i<n;i+=step)pts.push([a[i],(n-i)/n]);
    pts.push([a[n-1],1/n]);
    return pts;
  }
  // The simulation needs the three points in order; the inputs do not force it.
  function ordered(t){return t.slice().sort((a,b)=>a-b);}
  function isOrdered(t){return t[0]<=t[1]&&t[1]<=t[2];}

  // ----------------------------------------------------------------- hooks
  function useWidth(ref,fallback){
    const [w,setW]=useState(fallback||640);
    useEffect(()=>{
      const node=ref.current;
      if(!node)return;
      const read=()=>{const r=node.getBoundingClientRect();if(r.width>0)setW(r.width);};
      read();
      const raf=requestAnimationFrame(read);
      const ro=typeof ResizeObserver!=="undefined"?new ResizeObserver(read):null;
      if(ro)ro.observe(node);
      window.addEventListener("resize",read);
      return()=>{cancelAnimationFrame(raf);window.removeEventListener("resize",read);if(ro)ro.disconnect();};
    },[ref]);
    return w;
  }
  function useNarrow(bp){
    const [n,setN]=useState(()=>window.innerWidth<bp);
    useEffect(()=>{const f=()=>setN(window.innerWidth<bp);window.addEventListener("resize",f);return()=>window.removeEventListener("resize",f);},[bp]);
    return n;
  }

  // -------------------------------------------------------------- controls
  function AmountField({value,onCommit,isMoney,ccy,ariaLabel}){
    const shown=isMoney?money(value,ccy):plain(value);
    const [text,setText]=useState(shown);
    useEffect(()=>{setText(shown);},[shown]);
    function commit(){
      const v=isMoney?parseAmount(text):parseFloat(String(text).replace(/[^0-9.]/g,""));
      if(Number.isFinite(v)&&v>=0)onCommit(v);
      setText(isMoney?money(Number.isFinite(v)&&v>=0?v:value,ccy):plain(Number.isFinite(v)&&v>=0?v:value));
    }
    return el('input',{className:"field",type:"text",inputMode:"decimal",value:text,"aria-label":ariaLabel,
      onChange:e=>setText(e.target.value),onBlur:commit,
      onKeyDown:e=>{if(e.key==="Enter")e.currentTarget.blur();}});
  }

  function Triple({title,unit,values,onChange,isMoney,ccy}){
    const subs=["low","likely","high"];
    return el('div',null,
      el('div',{className:"label-row"},el('span',{className:"label"},title),el('span',{className:"unit"},unit)),
      el('div',{className:"triple"},
        subs.map((s,i)=>el('div',{key:s},
          el('div',{className:"sub"},s),
          el(AmountField,{value:values[i],isMoney,ccy,ariaLabel:title+" "+s,
            onCommit:v=>{const next=values.slice();next[i]=v;onChange(next);}})))),
      !isOrdered(values)&&el('div',{className:"warn"},"Low, likely and high are out of order; the simulation sorts them before use."));
  }

  function confidenceSummary(b){
    const s=b.confidence_summary||{};
    const parts=["low","medium","high","unstated"].filter(k=>s[k]).map(k=>s[k]+" "+k);
    return parts.length?parts.join(", "):"confidence unstated";
  }
  function tidy(s){return String(s||"").replace(/_/g," ");}

  function SourceCard({bm}){
    const status=(bm.maturity&&bm.maturity.benchmark_status)||bm.status||"status unstated";
    const prov=bm.provenance||{};
    const keys=Object.keys(prov);
    return el('div',{className:"source"},
      el('div',{className:"badges"},
        el('span',{className:"badge ccy"},bm.currency),
        el('span',{className:"badge"},tidy(status)),
        el('span',{className:"badge"},tidy(bm.provenance_tier)),
        el('span',{className:"badge"},confidenceSummary(bm))),
      bm.not_good_for
        ?el('div',{className:"caveat"},el('strong',null,"Not good for: "),bm.not_good_for)
        :el('div',{className:"caveat"},el('strong',null,"No stated limits. "),
            "Nobody upstream has written down what this shard is not good for. Read that as a gap in the record, not an all-clear, and check each parameter's limitation below."),
      keys.length>0&&el('details',{className:"sources"},
        el('summary',null,"Where the numbers come from ("+keys.length+" parameters)"),
        el('ul',null,keys.map(k=>{
          const p=prov[k];
          return el('li',{key:k},

  function ExceedanceChart({run,ccy,lines,narrow,onHover,hover}){
    const box=useRef(null);
    const svgRef=useRef(null);
    const width=useWidth(box,720);
    const height=narrow?330:430;
    const m={top:52,right:narrow?50:64,bottom:40,left:narrow?40:48};
    const pw=Math.max(10,width-m.left-m.right),ph=height-m.top-m.bottom;
    const xMax=(run.max>0?run.max:1)*1.02;
    const xs=v=>m.left+Math.min(v/xMax,1)*pw;
    const ys=p=>m.top+(1-p)*ph;
    const fromPx=px=>Math.max(0,Math.min(xMax,(px-m.left)/pw*xMax));

    const pts=useMemo(()=>curvePoints(run,400),[run]);
    let d="M"+xs(pts[0][0])+" "+ys(pts[0][1]);
    for(let i=1;i<pts.length;i++)d+="L"+xs(pts[i][0])+" "+ys(pts[i][1]);
    const area=d+"L"+xs(pts[pts.length-1][0])+" "+ys(0)+"L"+xs(pts[0][0])+" "+ys(0)+"Z";

    const leftTicks=[0,0.25,0.5,0.75,1];
    const rightTicks=[[0.5,"1 in 2"],[0.25,"1 in 4"],[0.1,"1 in 10"],[0.01,"1 in 100"]];
    const xTicks=[0,1,2,3,4].map(i=>xMax*i/4);

    function move(clientX){
      const svg=svgRef.current;if(!svg)return;
      const r=svg.getBoundingClientRect();
      const px=(clientX-r.left)*(width/r.width);
      if(px<m.left||px>width-m.right){onHover(null);return;}
      const loss=fromPx(px);
      onHover({loss,p:chanceAtLeast(run,loss)});
    }

    const active=lines.filter(l=>l.amount>0);
    const flags=active.map((l,i)=>{
      const beyond=l.amount>xMax;
      const x=beyond?m.left+pw:xs(l.amount);
      const p=chanceAtLeast(run,l.amount);
      return {l,x,p,beyond,row:i%2};
    });

    return el('div',{ref:box},
      el('svg',{ref:svgRef,className:"chart",viewBox:"0 0 "+width+" "+height,role:"img",
        "aria-label":"Exceedance curve: probability that annual loss reaches each amount or more",
        style:{cursor:"crosshair"},
        onMouseMove:e=>move(e.clientX),onMouseLeave:()=>onHover(null),
        onTouchStart:e=>{if(e.touches[0])move(e.touches[0].clientX);},
        onTouchMove:e=>{if(e.touches[0])move(e.touches[0].clientX);},
        onTouchEnd:()=>onHover(null)},
        // plot frame
        el('rect',{x:m.left,y:m.top,width:pw,height:ph,fill:"var(--paper)",rx:6}),
        leftTicks.map(t=>el('g',{key:"l"+t},
          el('line',{x1:m.left,x2:m.left+pw,y1:ys(t),y2:ys(t),stroke:"var(--line)",strokeWidth:t===0?1:0.6,strokeDasharray:t===0?null:"2 4"}),
          el('text',{x:m.left-8,y:ys(t)+3.5,textAnchor:"end",fontSize:narrow?9:10,fill:"var(--muted)"},Math.round(t*100)+"%"))),
        rightTicks.map(([t,lab])=>el('g',{key:"r"+t},
          el('line',{x1:m.left+pw,x2:m.left+pw+5,y1:ys(t),y2:ys(t),stroke:"var(--muted)",strokeWidth:1}),
          el('text',{x:m.left+pw+9,y:ys(t)+3.5,fontSize:narrow?9:10,fill:"var(--muted)"},lab))),
        xTicks.map((v,i)=>el('g',{key:"x"+i},
          el('line',{x1:xs(v),x2:xs(v),y1:m.top+ph,y2:m.top+ph+5,stroke:"var(--muted)",strokeWidth:1}),
          el('text',{x:xs(v),y:m.top+ph+18,textAnchor:i===0?"start":i===4?"end":"middle",fontSize:narrow?9:10,fill:"var(--muted)"},money(v,ccy)))),
        el('text',{x:m.left+8,y:m.top+14,fontSize:10,fill:"var(--muted)",fontWeight:600,letterSpacing:".08em"},"CHANCE OF A YEAR AT LEAST THIS BAD"),
        el('text',{x:m.left+pw,y:m.top+ph+34,textAnchor:"end",fontSize:10,fill:"var(--muted)",fontWeight:600,letterSpacing:".08em"},"ANNUAL LOSS →"),
        // curve
        el('path',{d:area,fill:"var(--rose-2)",opacity:0.18}),
        el('path',{d,fill:"none",stroke:"var(--rose)",strokeWidth:2.25,strokeLinejoin:"round"}),
        // decision lines
        flags.map(f=>{
          const text=(f.l.name||"Line")+" · "+money(f.l.amount,ccy)+(f.beyond?" →":"");
          const w=text.length*5.6+14;
          const flip=f.x+w>m.left+pw;
          return el('g',{key:f.l.id},
            el('line',{x1:f.x,x2:f.x,y1:ys(0),y2:f.beyond?m.top:ys(f.p),stroke:f.l.color,strokeWidth:1.5,strokeDasharray:f.beyond?"3 3":null}),
            !f.beyond&&el('circle',{cx:f.x,cy:ys(f.p),r:4.5,fill:f.l.color,stroke:"var(--panel)",strokeWidth:2}),
            el('g',{transform:"translate("+f.x+","+(m.top-12-(f.row*18))+")"},
              el('rect',{x:flip?-w:0,y:-8,width:w,height:16,rx:4,fill:f.l.color}),
              el('text',{x:flip?-7:7,y:3.5,textAnchor:flip?"end":"start",fontSize:9.5,fontWeight:600,fill:"#fff"},text)));
        }),
        // hover
        hover&&el('g',null,
          el('line',{x1:xs(hover.loss),x2:xs(hover.loss),y1:m.top,y2:ys(0),stroke:"var(--ink)",strokeWidth:1,strokeDasharray:"3 3",opacity:0.5}),
          el('line',{x1:m.left,x2:xs(hover.loss),y1:ys(hover.p),y2:ys(hover.p),stroke:"var(--ink)",strokeWidth:1,strokeDasharray:"3 3",opacity:0.5}),
          el('circle',{cx:xs(hover.loss),cy:ys(hover.p),r:5,fill:"var(--ink)",stroke:"var(--panel)",strokeWidth:2}),
          el('rect',{x:m.left-46,y:ys(hover.p)-9,width:42,height:18,rx:9,fill:"var(--ink)"}),
          el('text',{x:m.left-25,y:ys(hover.p)+3.5,textAnchor:"middle",fontSize:9.5,fontWeight:700,fill:"#fff"},pct(hover.p)),
          el('rect',{x:xs(hover.loss)-28,y:m.top+ph+3,width:56,height:16,rx:8,fill:"var(--ink)"}),
          el('text',{x:xs(hover.loss),y:m.top+ph+14.5,textAnchor:"middle",fontSize:9,fontWeight:700,fill:"#fff"},money(hover.loss,ccy)))));
  }

  function LossHistogram({run,ccy,narrow}){
    const box=useRef(null);
    const width=useWidth(box,720);
    const height=narrow?260:320;
    const m={top:18,right:16,bottom:48,left:16};
    const pw=Math.max(10,width-m.left-m.right),ph=height-m.top-m.bottom;
    const vals=[];
    for(let i=0;i<run.n;i++)if(run.sorted[i]>0)vals.push(run.sorted[i]);
    if(vals.length<2){
      return el('div',{className:"readout"},pct(run.zeroShare)+" of simulated years had no loss event, so there is nothing to bin. Raise the frequency range to see a distribution.");
    }
    const lo=vals[0],hi=vals[vals.length-1];
    const nb=narrow?24:40,bw=(hi-lo)/nb||1;
    const bins=new Array(nb).fill(0);
    for(const v of vals)bins[Math.min(nb-1,Math.floor((v-lo)/bw))]++;
    const top=Math.max(...bins);
    const xs=v=>m.left+((v-lo)/(hi-lo||1))*pw;
    const marks=[["median",run.p50],["1 in 10",run.p90],["1 in 100",run.p99]].filter(x=>x[1]>=lo);
    return el('div',{ref:box},
      el('svg',{className:"chart",viewBox:"0 0 "+width+" "+height,role:"img","aria-label":"Histogram of simulated annual loss"},
        el('rect',{x:m.left,y:m.top,width:pw,height:ph,fill:"var(--paper)",rx:6}),
        bins.map((c,i)=>{
          if(!c)return null;
          const bh=(c/top)*ph;
          return el('rect',{key:i,x:m.left+i*(pw/nb)+0.5,y:m.top+ph-bh,width:Math.max(1,pw/nb-1),height:bh,fill:"var(--rose-2)",opacity:0.9,rx:1.5});
        }),
        el('line',{x1:m.left,x2:m.left+pw,y1:m.top+ph,y2:m.top+ph,stroke:"var(--line)"}),
        marks.map(([lab,v],i)=>el('g',{key:lab},
          el('line',{x1:xs(v),x2:xs(v),y1:m.top,y2:m.top+ph+6,stroke:i===0?"var(--muted)":"var(--rose)",strokeWidth:1,strokeDasharray:"3 3"}),
          el('text',{x:xs(v),y:m.top+ph+18,textAnchor:"middle",fontSize:9.5,fontWeight:600,fill:i===0?"var(--muted)":"var(--rose)"},lab),
          el('text',{x:xs(v),y:m.top+ph+30,textAnchor:"middle",fontSize:9,fill:"var(--muted)"},money(v,ccy)))),
        el('text',{x:m.left,y:m.top+ph+44,fontSize:9.5,fill:"var(--muted)"},money(lo,ccy)),
        el('text',{x:m.left+pw,y:m.top+ph+44,textAnchor:"end",fontSize:9.5,fill:"var(--muted)"},money(hi,ccy))),
      el('div',{className:"chart-foot"},
        el('span',null,"Each bar counts simulated years whose total loss fell in that range."),
        run.zeroShare>0&&el('span',null,pct(run.zeroShare)+" of years had no loss and are not drawn.")));
  }

  const LINE_SEED=[
    {id:"tolerance",name:"Risk tolerance",fixed:true,color:"#8d5860",why:"The annual loss you have decided to absorb from this risk before anything has to change."},

  function amountsFromRun(run){
    return {tolerance:Math.round(run.p90),reserve:Math.round(run.p50>0?run.p50:run.mean),materiality:Math.round(run.p99),custom:0};

  function LineAmount({value,ccy,onCommit}){
    const shown=value>0?money(value,ccy):"";
    const [text,setText]=useState(shown);
    useEffect(()=>{setText(shown);},[shown]);
    function commit(){
      if(text.trim()===""){onCommit(0);return;}
      const v=parseAmount(text);
      if(Number.isFinite(v)&&v>0){onCommit(v);setText(money(v,ccy));}
      else setText(shown);
    }
    return el('input',{className:"field amt",type:"text",inputMode:"decimal",placeholder:"e.g. "+symbolFor(ccy)+"5M",value:text,
      onChange:e=>setText(e.target.value),onBlur:commit,onKeyDown:e=>{if(e.key==="Enter")e.currentTarget.blur();},
      "aria-label":"Amount"});
  }

  function DecisionLines({lines,setLines,run,ccy}){
    function update(id,patch){setLines(ls=>ls.map(l=>l.id===id?Object.assign({},l,patch):l));}
    const active=lines.filter(l=>l.amount>0);
    const tol=lines.find(l=>l.id==="tolerance"),res=lines.find(l=>l.id==="reserve");
    const both=tol.amount>0&&res.amount>0;

        el('h2',null,"Decision lines"),
        el('button',{type:"button",className:"btn ghost small",onClick:()=>{const a=amountsFromRun(run);setLines(ls=>ls.map(l=>l.id==="custom"?l:Object.assign({},l,{amount:a[l.id]})));}},"Suggest from this run")),

      el('table',null,
        el('thead',null,el('tr',null,
          el('th',null,"Line"),el('th',{className:"num"},"Amount"),el('th',{className:"num"},"Chance per year"),el('th',{className:"num"},"Roughly"),el('th',null,""))),

            el('td',null,

              el('span',{className:"why"},l.why)),
            el('td',{className:"num","data-k":"amount"},el(LineAmount,{value:l.amount,ccy,onCommit:v=>update(l.id,{amount:v})})),

  // ------------------------------------------------------------------- app
  function App(){
    const narrow=useNarrow(900);
    const [list,setList]=useState([]);

    const [tick,setTick]=useState(0);
    const [lines,setLines]=useState(()=>LINE_SEED.map(l=>Object.assign({},l,{amount:TEACHING_AMOUNTS[l.id]})));
    // Set when the scenario changes; the next run decides the suggested lines.
    const [reseed,setReseed]=useState(null);

    useEffect(()=>{
      let live=true;
      fetch(BENCHMARKS_URL)
        .then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
        .then(d=>{if(live)setList(Array.isArray(d.benchmarks)?d.benchmarks:[]);})
        .catch(e=>{if(live)setListErr(e.message);});
      return()=>{live=false;};
    },[]);

    const run=useMemo(()=>summarise(simulate(ordered(freq),ordered(sev),YEARS)),[freq,sev,tick]);
    const bm=list.find(b=>b.id===scenario)||null;

    useEffect(()=>{
      if(!reseed)return;
      const a=reseed==="run"?amountsFromRun(run):TEACHING_AMOUNTS;
      setLines(ls=>ls.map(l=>Object.assign({},l,{amount:a[l.id]})));
      setReseed(null);
    },[run,reseed]);

    function chooseScenario(id){
      const b=list.find(x=>x.id===id)||null;
      setScenario(id);
      if(b){
        setCcy(b.currency||"USD");
        setFreq([b.frequency.min,b.frequency.likely,b.frequency.max]);
        setSev([b.impact.min,b.impact.likely,b.impact.max]);
        setReseed("run");
      }else{
        setCcy("USD");setFreq(DEFAULT_FREQ);setSev(DEFAULT_SEV);
        setReseed("teaching");
      }
    }

    return el('div',null,
      !EMBEDDED&&el('header',{className:"wrap masthead"},
        el('div',{className:"kicker"},"RootCaws · Risk lab"),
        el('h1',null,"Exceedance ",el('em',null,"Workbench")),
        el('p',{className:"deck"},"Turn a three-point estimate into ten thousand simulated years, then read the odds of any loss you care about straight off the curve, and see where your own tolerance, reserve and materiality lines land on it.")),
      !EMBEDDED&&el(Guide),
      el('div',{className:"wrap bench"},
        el(Controls,{list,listErr,scenario,onScenario:chooseScenario,bm,freq,setFreq,sev,setSev,ccy,onResample:()=>setTick(t=>t+1)}),
        el('section',{"aria-label":"Results"},
          el(StatStrip,{run,ccy}),
          el(ChartPanel,{run,ccy,lines,narrow}),
          el(DecisionLines,{lines,setLines,run,ccy}))),
      el(Notes));
  }

  // Embedded in the portfolio risk lab, which is on another origin and cannot
  // measure this document. Report the page height so the frame can fit it.
  if(EMBEDDED){
    let lastHeight=0;
    const reportHeight=()=>{const h=Math.ceil(document.documentElement.getBoundingClientRect().height);if(h>0&&h!==lastHeight){lastHeight=h;window.parent.postMessage({type:"risk-lab:height",height:h},"*");}};
    if(typeof ResizeObserver!=="undefined")new ResizeObserver(reportHeight).observe(document.body);
    window.addEventListener("load",reportHeight);
    setTimeout(reportHeight,0);
  }

  ReactDOM.createRoot(document.getElementById('root')).render(el(App));
  </script>
</body>
</html>
